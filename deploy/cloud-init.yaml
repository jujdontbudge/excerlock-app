#cloud-config
# ExcerLock API box -- first-boot config (PRD Sec. 10.1 stack: Node 22 + Postgres + Caddy,
# rsync -> systemd deploys, no Docker). Rendered by deploy/azure-provision.sh, which
# substitutes %DOMAIN% into the Caddyfile before passing this as --custom-data.
# Cloud-init runs ONCE on first boot; later changes belong to the deploy script.

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - gnupg
  - apt-transport-https
  - rsync
  - postgresql
  - postgresql-contrib
  # deploy.sh runs `npm ci` on this box, so any dependency without an arm64
  # prebuilt binary has to compile here. Cheap to install, expensive to discover
  # missing mid-deploy.
  - build-essential
  - python3

users:
  - default
  - name: excerlock
    system: true
    shell: /usr/sbin/nologin
    homedir: /opt/excerlock
    lock_passwd: true

write_files:
  # Secrets land here at deploy time (Sec. 10.10: EnvironmentFile, never committed).
  - path: /etc/excerlock/excerlock-api.env
    owner: root:root
    permissions: "0600"
    content: |
      NODE_ENV=production
      PORT=3000
      # Local socket + peer auth: unix user `excerlock` maps to the same-name PG role.
      DATABASE_URL=postgres://excerlock@/excerlock?host=/var/run/postgresql
      # Filled in by the provisioning runbook (PRD Sec. 10.10) -- values never committed:
      # CLERK_SECRET_KEY=
      # ADAPTY_SECRET_KEY=
      # ADAPTY_WEBHOOK_SECRET=
      # POSTHOG_API_KEY=
      # POSTHOG_PERSONAL_API_KEY=  # person:write, for account erasure
      # POSTHOG_PROJECT_ID=
      # POSTHOG_API_HOST=https://us.posthog.com
      # RESEND_API_KEY=
      # SENTRY_DSN=
      # STRAVA_CLIENT_ID= / STRAVA_CLIENT_SECRET=  (and Oura/Whoop/Polar, Sec. 3.5c)

  - path: /etc/systemd/system/excerlock-api.service
    owner: root:root
    permissions: "0644"
    content: |
      [Unit]
      Description=ExcerLock API (Fastify)
      After=network-online.target postgresql.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=excerlock
      Group=excerlock
      WorkingDirectory=/opt/excerlock/server
      EnvironmentFile=/etc/excerlock/excerlock-api.env
      ExecStart=/usr/bin/node dist/index.js
      Restart=on-failure
      RestartSec=3
      NoNewPrivileges=true
      PrivateTmp=true
      ProtectSystem=full

      [Install]
      WantedBy=multi-user.target

  # %DOMAIN% is replaced by azure-provision.sh (falls back to ":80" = plain HTTP
  # on the bare IP until a real domain is set -- Caddy mints TLS automatically
  # once a domain with a live A record is in place).
  - path: /etc/caddy/Caddyfile
    owner: root:root
    permissions: "0644"
    content: |
      %DOMAIN% {
      	reverse_proxy 127.0.0.1:3000
      }

runcmd:
  # Node 22 (NodeSource) -- PRD Sec. 10.9 server set runs on Node 22 LTS.
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
  # Caddy (official cloudsmith apt repo) -- auto-TLS reverse proxy.
  - curl -fsSL https://dl.cloudsmith.io/public/caddy/stable/gpg.key | gpg --dearmor -o /etc/apt/keyrings/caddy-stable.gpg
  - curl -fsSL "https://dl.cloudsmith.io/public/caddy/stable/config.deb.txt?distro=ubuntu&codename=noble" -o /etc/apt/sources.list.d/caddy-stable.list
  - sed -i 's|signed-by=/usr/share/keyrings/caddy-stable-archive-keyring.gpg|signed-by=/etc/apt/keyrings/caddy-stable.gpg|g' /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  # write_files already planted /etc/caddy/Caddyfile, so dpkg sees a conffile it
  # did not install and stops on the interactive "*** Caddyfile (Y/I/N/O/D/Z)?"
  # prompt. That aborts `dpkg --configure caddy`, which means the `caddy` system
  # user is never created, which makes caddy.service die with 217/USER. Observed
  # on the first westus boot, 2026-07-30. --force-confold keeps OUR Caddyfile,
  # which is the intent, and makes the install genuinely non-interactive.
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confold -o Dpkg::Options::=--force-confdef nodejs caddy
  # App dirs (rsync target for deploy.sh).
  - mkdir -p /opt/excerlock/server
  - chown -R excerlock:excerlock /opt/excerlock
  # Postgres: same-name role + db, peer auth over the unix socket, port never exposed
  # (listens on localhost; NSG keeps 5432 closed anyway). Idempotent.
  - sudo -u postgres psql -tAc "SELECT 1 FROM pg_roles WHERE rolname='excerlock'" | grep -q 1 || sudo -u postgres createuser excerlock
  - sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='excerlock'" | grep -q 1 || sudo -u postgres createdb -O excerlock excerlock
  # Services: postgres + caddy run now; excerlock-api stays installed-but-disabled
  # until the first real deploy rsyncs code in (deploy.sh enables + starts it).
  - systemctl daemon-reload
  - systemctl enable --now postgresql
  - systemctl enable --now caddy
  - systemctl restart caddy
