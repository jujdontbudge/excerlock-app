<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExcerLock — Loop transition preview</title>
<style>
body{margin:0;background:#17191b;color:white;font:14px system-ui;display:grid;justify-items:center;gap:12px;padding:16px}
main{position:relative;height:calc(100dvh - 105px);aspect-ratio:851/1849;overflow:hidden;border-radius:32px}
img{position:absolute;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .65s ease}
img.active{opacity:1}button{cursor:pointer}#next{position:absolute;left:5%;right:5%;bottom:6%;height:9%;border:0;background:transparent;border-radius:50px}
#next:focus-visible{outline:3px solid #222;outline-offset:-8px}
nav{display:flex;gap:18px;align-items:center}nav button{border:1px solid #888;background:none;color:white;padding:8px 16px;border-radius:16px}
@media(prefers-reduced-motion:reduce){img{transition:none}}
</style>
<main aria-label="Onboarding transition preview">
<img class="active" src="/loop-preview/loop-loop.png" alt="Stuck in the scroll loop">
<img src="/loop-preview/loop-break.png" alt="ExcerLock breaks the loop">
<img src="/loop-preview/loop-reward.png" alt="Build an exercise habit">
<button id="next" aria-label="Continue"></button>
</main>
<nav><button id="back">Back</button><span id="state" aria-live="polite">1 / 3</span><button id="restart">Restart</button></nav>
<small>Clickable storyboard · crossfade preview, not final in-app animation</small>
<script>
const frames=[...document.querySelectorAll('main img')];let index=0;
function show(i){index=Math.max(0,Math.min(2,i));frames.forEach((el,n)=>el.classList.toggle('active',n===index));document.querySelector('#state').textContent=(index+1)+' / 3';}
document.querySelector('#next').onclick=()=>show(index===2?0:index+1);
document.querySelector('#back').onclick=()=>show(index-1);
document.querySelector('#restart').onclick=()=>show(0);
</script></html>
