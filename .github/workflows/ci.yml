name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-and-guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Use the lockfile's npm version
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Verify actual Expo config loader
        run: node --test app-next/scripts/test-config-smoke.cjs

      - name: Verify app-next Metro and bundle-budget regressions
        run: node --test app-next/scripts/*.test.cjs

      - name: Verify signed-manifest validator fixtures
        run: python3 app-next/scripts/test_verify_signed_manifest.py

      - name: Verify catalog-drift guardrail fixtures
        run: python3 app-next/scripts/test_catalog_drift.py

      - name: Verify subscription-metadata guardrail fixtures
        run: python3 app-next/scripts/test_subscription_metadata.py

      - name: Run workspace type checks
        run: npm run typecheck

      - name: Run unit suites
        run: npm run test:unit

      - name: Run app-next unit suite
        run: npm run test --workspace app-next

      - name: Run app-next lint
        run: npm run lint --workspace app-next

      - name: Run architecture guardrails
        run: npm run test:guardrails

  ship-service-readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Use the lockfile's npm version
        run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Verify ship service environment (not device activation)
        working-directory: app-next
        run: npx tsx scripts/check-env.ts
        env:
          EXPO_PUBLIC_ADAPTY_KEY: ${{ secrets.EXPO_PUBLIC_ADAPTY_KEY }}
          EXPO_PUBLIC_POSTHOG_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.EXPO_PUBLIC_POSTHOG_HOST }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          ADAPTY_SECRET_KEY: ${{ secrets.ADAPTY_SECRET_KEY }}
