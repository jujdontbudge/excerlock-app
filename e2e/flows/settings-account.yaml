appId: com.johansardar.excerlock
name: Settings — grace persistence and account session
tags:
  - settings
  - persistence
  - account
env:
  SCENARIO: baseline-fresh-install
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
# iOS exposes a tab as "Settings, tab, N of 4" and Maestro matches text as a
# FULL match, so a bare "Settings" never matches the tab bar.
- tapOn: "Settings, tab.*"
- assertVisible:
    id: settings-screen
- assertVisible: No grace period selected
- tapOn: 2 minutes
- assertVisible: "Selected grace period: 2 minutes"

- scrollUntilVisible:
    element:
      text: Signed out
    direction: DOWN
- assertVisible: Signed out
- tapOn: Sign in
- assertVisible: Signed in
- assertVisible: member@excerlock.test

# Restart the process without clearing persisted state.
- launchApp
- tapOn: "Settings, tab.*"
- assertVisible:
    id: settings-screen
- assertVisible: "Selected grace period: 2 minutes"
- scrollUntilVisible:
    element:
      text: member@excerlock.test
    direction: DOWN
- assertVisible: Signed in
- tapOn: Sign out
- assertVisible: Signed out
- waitForAnimationToEnd
- takeScreenshot: settings-signed-out
