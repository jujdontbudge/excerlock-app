appId: com.johansardar.excerlock
name: Locked apps — shield causes, active window, and Full Lock
tags:
  - locked-apps
  - shields
  - full-lock
  - active-window
env:
  SCENARIO: balance-drain
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
- openLink:
    link: excerlock://locked-apps
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: lock-screen
    timeout: 10000

- assertVisible: Pick what ExcerLock can pause.
- assertVisible: Nothing is locked yet
- tapOn: Allow Screen Time
- extendedWaitUntil:
    # The card reads "Screen Time is on" with an "On" status pill beside it;
    # "Screen Time access: On" is a string the app never renders.
    visible: "Screen Time is on"
    timeout: 10000
- tapOn: Choose apps
- scrollUntilVisible:
    element:
      text: "Time's up — for now."
    direction: UP
- assertVisible: Today's balance is empty.
- assertVisible: "4 apps · 2 categories"
- waitForAnimationToEnd
- takeScreenshot: locked-apps-empty-balance

- scrollUntilVisible:
    element:
      text: Add lock window
    direction: DOWN
- tapOn: Add lock window
- tapOn: Monday
- tapOn: Tuesday
- tapOn: Wednesday
- tapOn: Thursday
- tapOn: Friday
- tapOn: Saturday
- tapOn: Sunday
- tapOn: Start time
- inputText: 23:59
- tapOn: End time
- inputText: 23:58
- hideKeyboard
- tapOn: Save lock window
- scrollUntilVisible:
    element:
      text: Apps are asleep.
    direction: UP
- assertVisible: A lock window is running.
- waitForAnimationToEnd
- takeScreenshot: locked-apps-active-window

- scrollUntilVisible:
    element:
      text: Full Lock is off
    direction: DOWN
- tapOn: Turn on Full Lock
- assertVisible: Turn on Full Lock?
- tapOn: Yes, turn it on
- assertVisible: Full Lock is on
- waitForAnimationToEnd
- takeScreenshot: locked-apps-full-lock
- scrollUntilVisible:
    element:
      text: Move first, scroll after.
    direction: UP
- assertVisible: Full Lock is on — your day starts at zero.
