appId: com.johansardar.excerlock
name: Onboarding — complete rail with premium entitlement
tags:
  - onboarding
  - premium
env:
  SCENARIO: baseline-fresh-install
  SCENARIO_OVERRIDES: "%7B%22state%22%3A%7B%22onboarding%22%3A%22fresh%22%7D%7D"
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}?overrides=${SCENARIO_OVERRIDES}
- runFlow:
    when:
      visible: 'Open in "ExcerLock"'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible: Earn your screen time
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
- waitForAnimationToEnd
- takeScreenshot: onboarding-value-prop
- tapOn: Get started

- assertVisible: "How much time do you spend on your phone each day?"
- waitForAnimationToEnd
- takeScreenshot: onboarding-confession
- tapOn: Continue

- assertVisible: "That's ~76 days a year"
- assertVisible: "5 hours a day becomes 1,825 hours every year."
- waitForAnimationToEnd
- takeScreenshot: onboarding-mirror
- tapOn: Take it back

- assertVisible: Screen Time keeps your choices honest
- waitForAnimationToEnd
- takeScreenshot: onboarding-permissions-primer
- tapOn: Continue

- assertVisible: Pick the apps that can wait
- waitForAnimationToEnd
- takeScreenshot: onboarding-pick-apps
- tapOn: Choose apps

- extendedWaitUntil:
    visible: Your ExcerLock plan is active
    timeout: 10000
- assertVisible: Premium access is unlocked.
- waitForAnimationToEnd
- takeScreenshot: onboarding-premium-paywall
- tapOn: Continue

- extendedWaitUntil:
    visible: Create your account
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: onboarding-sign-up
- tapOn: Create account

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
