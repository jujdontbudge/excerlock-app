appId: com.johansardar.excerlock
name: Manage — edits allowance and condition state
tags:
  - manage
  - conditions
env:
  SCENARIO: baseline-fresh-install
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
# iOS exposes a tab as "Manage, tab, N of 4" and Maestro matches text as a
# FULL match, so a bare "Manage" never matches the tab bar.
- tapOn: "Manage, tab.*"
- assertVisible:
    id: manage-screen
# The app renders durations compactly everywhere -- "45m" here, "4h 0m" in the
# range label below it, "45m of screen time left" on Home. "45 minutes" is a
# string the app never produces, so bind the assertion to the value element and
# its real text rather than to a free-floating phrase.
- assertVisible:
    id: manage-allowance-value
    text: "45m"

- scrollUntilVisible:
    element:
      id: schedule-rules-card
    direction: DOWN
    # Tab bar floats over content, so centre the card before acting on it.
    centerElement: true
- tapOn: Monday rest day
- assertVisible:
    id: schedule-weekday-status-1
    text: Rest

- scrollUntilVisible:
    element:
      id: manage-row-e2e-condition-1
    direction: DOWN
    # Tab bar floats over content, so centre the card before acting on it.
    centerElement: true
- tapOn:
    id: manage-toggle-e2e-condition-1
- assertVisible:
    id: manage-switch-label-e2e-condition-1
- assertVisible: "Off"
- tapOn:
    id: manage-toggle-e2e-condition-1
- assertVisible: "On"

- scrollUntilVisible:
    element:
      id: manage-allowance-value
    direction: UP
    # The allowance stepper is above the schedule and condition cards.
    centerElement: true
- tapOn: Increase daily allowance
- assertVisible:
    id: manage-allowance-value
    text: "50m"
- waitForAnimationToEnd
- takeScreenshot: manage-condition-enabled
