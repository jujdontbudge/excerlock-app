appId: com.johansardar.excerlock
name: Manage — edits allowance and condition state
tags:
  - manage
  - conditions
env:
  SCENARIO: baseline-fresh-install
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
# iOS exposes a tab as "Manage, tab, N of 4" and Maestro matches text as a
# FULL match, so a bare "Manage" never matches the tab bar.
- tapOn: "Manage, tab.*"
- assertVisible:
    id: manage-screen
- assertVisible:
    id: manage-allowance-value
- assertVisible: 45 minutes

- scrollUntilVisible:
    element:
      id: schedule-rules-card
    direction: DOWN
- tapOn: Monday rest day
- assertVisible:
    id: schedule-weekday-status-1
    text: Rest

- scrollUntilVisible:
    element:
      id: manage-row-e2e-condition-1
    direction: DOWN
- tapOn:
    id: manage-toggle-e2e-condition-1
- assertVisible:
    id: manage-switch-label-e2e-condition-1
- assertVisible: "Off"
- tapOn:
    id: manage-toggle-e2e-condition-1
- assertVisible: "On"

- tapOn: Increase daily allowance
- assertVisible: 50 minutes
- waitForAnimationToEnd
- takeScreenshot: manage-condition-enabled
