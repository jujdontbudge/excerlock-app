appId: com.johansardar.excerlock
name: Screen Time permission — real FamilyControls authorization on the simulator
# The one flow that runs against the NATIVE ScreenTimeModule (the scenario
# declares screenTimeModule: "native"). Everything asserted here is real
# FamilyControls behavior, measured 2026-08-04 on a fresh iOS 26.4.1 simulator:
#
#   - the app renders the OS's real answer, not MockScreenTimeModule's;
#   - on a never-asked device the primer shows "Not set up"; once ANY build of
#     the app has been granted, the OS remembers across uninstall/reinstall and
#     even `simctl privacy reset all` — so this flow must accept either start;
#   - requestAuthorization(.individual) completes SILENTLY on the simulator —
#     no sheet is presented, approval is instant and persists OS-side. (The
#     2026-08-01 measurement of a presented-then-canceled sheet came from a
#     long-lived device that has since been deleted and did not reproduce on a
#     fresh one; docs/research/familycontrols-on-simulator.md holds the trail.)
#
# So the flow drives BOTH possible start states to the same end: authorized,
# with the approved-state UI unlocked. The deny path cannot be produced on a
# simulator (no sheet → nothing to refuse) — that is #84 hardware work, along
# with real shield enforcement.
tags:
  - shield-adjacent
  - permission
env:
  SCENARIO: screentime-permission
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
- openLink:
    link: excerlock://locked-apps
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible:
      id: lock-screen
    timeout: 10000

# Never-asked device: the primer offers the request. Previously-granted
# device: the panel already reads "Screen Time is on". Converge them.
- runFlow:
    when:
      visible: Allow Screen Time
    commands:
      - assertVisible: Screen Time keeps your choices honest
      - assertVisible: "Not set up"
      - tapOn: Allow Screen Time

# The real module's answer after the request: approved, silently.
- extendedWaitUntil:
    visible: "Screen Time is on"
    timeout: 15000
- takeScreenshot: screentime-permission-approved
- assertVisible:
    id: lock-screen
# Authorization gates the picker; approved unlocks it.
- assertVisible: Choose apps
- assertNotVisible: Allow Screen Time
