appId: com.johansardar.excerlock
name: Settings — notifications and support
tags:
  - settings
  - notifications
  - support
env:
  SCENARIO: baseline-fresh-install
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}
- runFlow:
    when:
      visible: 'Open in .ExcerLock.\?'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
# iOS exposes a tab as "Settings, tab, N of 4" and Maestro matches text as a
# FULL match, so a bare "Settings" never matches the tab bar.
- tapOn: "Settings, tab.*"
- assertVisible:
    id: settings-screen

# Scroll to the toggle itself, not the card — centring the card leaves the
# first toggle above the viewport and XCUITest only reports what is on screen.
- scrollUntilVisible:
    element:
      id: notification-toggle-afternoonNudge
    direction: DOWN
    # Tab bar floats over content, so centre the row before tapping it.
    centerElement: true
# The OS remembers a granted notification permission across clearState and
# launchApp permissions:unset does not clear it (verified 2026-08-04), so this
# converges both start states: a fresh device walks the primer, a granted one
# skips straight to the approved card.
- tapOn:
    id: notification-toggle-afternoonNudge
- runFlow:
    when:
      visible:
        id: notification-permission-primer
    commands:
      - assertVisible: Choose what helps
      - tapOn: Allow notifications
- extendedWaitUntil:
    visible: Notifications are on
    timeout: 10000

- scrollUntilVisible:
    element:
      text: Contact support
    direction: DOWN
    # Tab bar floats over content, so centre the row before tapping it.
    centerElement: true
- tapOn: Contact support
- assertVisible:
    id: support-composer
- tapOn:
    id: support-composer-message-input
- inputText: E2E support request
- hideKeyboard
- tapOn: Send support request
- assertVisible: E2E support request
- assertVisible: Sent

- tapOn: Request a feature
- assertVisible:
    id: support-composer
- tapOn:
    id: support-composer-title-input
- inputText: E2E dashboard
- hideKeyboard
- tapOn:
    id: support-composer-message-input
- inputText: Show the deterministic E2E state.
- hideKeyboard
- tapOn: Submit feature request
- assertVisible: E2E dashboard
- scrollUntilVisible:
    element:
      text: Vote for E2E dashboard
    direction: DOWN
    # Keep the floating tab bar from covering the vote button.
    centerElement: true
- assertVisible: Vote for E2E dashboard
- tapOn: Vote for E2E dashboard
- assertVisible: Voted for E2E dashboard
- waitForAnimationToEnd
- takeScreenshot: settings-support-history
