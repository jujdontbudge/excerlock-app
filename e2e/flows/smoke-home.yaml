# ============================================================================
# TEMPLATE — the app does not exist yet. Do not expect this flow to run.
# Placeholder values marked TBD:
#   appId            → ios.bundleIdentifier of the e2e simulator build (TBD)
#   deep-link scheme → excerlock:// assumed; confirm when the app registers it
#   testIDs          → tab-bar testID convention below is the proposal the app
#                      build should adopt (tab-<name>, screen-<name>)
# Pattern documented in docs/research/e2e-loop.md (ticket #20).
# ============================================================================
appId: com.excerlock.app # TBD — replace with real bundle identifier
tags:
  - smoke
  - home
env:
  SCENARIO: baseline-fresh-install # fixture scenario the mock boundary loads
---
# Launch clean and load the named mock scenario via deep link.
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}
# First-ever deep link on a fresh sim shows an iOS confirm dialog once.
- runFlow:
    when:
      visible: 'Open in "ExcerLock"'
    commands:
      - tapOn: Open

# Tab bar is the app's spine: Home / Manage / Analysis / Settings.
- extendedWaitUntil:
    visible:
      id: tab-home
    timeout: 10000

# --- Home ---
- tapOn:
    id: tab-home
- assertVisible:
    id: screen-home
# TODO(app): assert balance card renders for ${SCENARIO}

# --- Manage ---
- tapOn:
    id: tab-manage
- assertVisible:
    id: screen-manage

# --- Analysis ---
- tapOn:
    id: tab-analysis
- assertVisible:
    id: screen-analysis

# --- Settings ---
- tapOn:
    id: tab-settings
- assertVisible:
    id: screen-settings

