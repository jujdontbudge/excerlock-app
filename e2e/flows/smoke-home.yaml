appId: com.johansardar.excerlock
name: Home — walking holds zero-balance apps open
tags:
  - smoke
  - home
  - walking
  - zero-balance
env:
  # One bundled scenario. This patch changes two supported axes: the clock
  # replays the walking fixture and the balance starts at zero.
  SCENARIO: baseline-fresh-install
  SCENARIO_OVERRIDES: "%7B%22clock%22%3A%7B%22playback%22%3A%22auto%22%2C%22speed%22%3A60%7D%2C%22state%22%3A%7B%22ledger%22%3A%7B%22baseAllowanceMinutes%22%3A0%7D%7D%7D"
---
- launchApp:
    clearState: true
- openLink:
    link: excerlock://e2e/scenario/${SCENARIO}?overrides=${SCENARIO_OVERRIDES}
- runFlow:
    when:
      visible: 'Open in "ExcerLock"'
    commands:
      - tapOn: Open

- extendedWaitUntil:
    visible:
      id: home-screen
    timeout: 10000
- assertNotVisible:
    id: screen-e2e-error
- extendedWaitUntil:
    visible:
      id: lock-hero-unlocked
    timeout: 10000
- assertVisible:
    id: lock-hero-balance
- assertVisible: "Active · apps unlocked"
- assertVisible: "While walking is holding your apps open"
- waitForAnimationToEnd
- takeScreenshot: home-walking-zero-balance
