appId: com.johansardar.excerlock
name: Persists the stop grace period
tags:
  - settings
  - persistence
---
- launchApp:
    clearState: true
- tapOn: "Settings"
- assertVisible:
    id: settings-screen
- assertVisible: "No grace period selected"

- tapOn: "2 minutes"
- assertVisible: "Selected grace period: 2 minutes"

# launchApp stops and restarts the process without clearing AsyncStorage.
- launchApp
- tapOn: "Settings"
- assertVisible:
    id: settings-screen
- assertVisible: "Selected grace period: 2 minutes"
