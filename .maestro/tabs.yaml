appId: com.johansardar.excerlock
name: Navigates all four tabs
tags:
  - smoke
  - tabs
---
- launchApp:
    clearState: true

- assertVisible:
    id: home-screen
- assertVisible: "No conditions yet"

- tapOn: "Manage"
- assertVisible:
    id: manage-screen
- assertVisible: "Manage"

- tapOn: "Analysis"
- assertVisible:
    id: analysis-screen
- assertVisible:
    id: earned-spent-card

- tapOn: "Settings"
- assertVisible:
    id: settings-screen
- assertVisible: "Stop grace period"

- tapOn: "Home"
- assertVisible:
    id: home-screen
